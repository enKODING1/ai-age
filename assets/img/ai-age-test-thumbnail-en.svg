<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.95);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.85);stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 필터 정의 -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 배경 패턴 -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="40" fill="white"/>
    <circle cx="1100" cy="530" r="30" fill="white"/>
    <circle cx="200" cy="500" r="20" fill="white"/>
    <circle cx="1000" cy="150" r="25" fill="white"/>
    <circle cx="500" cy="50" r="15" fill="white"/>
    <circle cx="800" cy="580" r="35" fill="white"/>
  </g>
  
  <!-- 메인 카드 -->
  <rect x="150" y="100" width="900" height="430" rx="24" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- AI 아이콘 -->
  <g transform="translate(200,150)">
    <!-- 얼굴 윤곽 -->
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="url(#iconGradient)" opacity="0.8"/>
    
    <!-- 눈 -->
    <circle cx="-20" cy="-15" r="8" fill="white"/>
    <circle cx="20" cy="-15" r="8" fill="white"/>
    <circle cx="-20" cy="-15" r="4" fill="url(#iconGradient)"/>
    <circle cx="20" cy="-15" r="4" fill="url(#iconGradient)"/>
    
    <!-- 코 -->
    <ellipse cx="0" cy="5" rx="3" ry="8" fill="white" opacity="0.7"/>
    
    <!-- 입 -->
    <path d="M -15 25 Q 0 35 15 25" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
    
    <!-- AI 회로 패턴 -->
    <g opacity="0.3">
      <line x1="-60" y1="-30" x2="-50" y2="-30" stroke="white" stroke-width="2"/>
      <line x1="50" y1="-30" x2="60" y2="-30" stroke="white" stroke-width="2"/>
      <line x1="-60" y1="0" x2="-50" y2="0" stroke="white" stroke-width="2"/>
      <line x1="50" y1="0" x2="60" y2="0" stroke="white" stroke-width="2"/>
      <circle cx="-65" cy="-30" r="3" fill="white"/>
      <circle cx="65" cy="-30" r="3" fill="white"/>
      <circle cx="-65" cy="0" r="3" fill="white"/>
      <circle cx="65" cy="0" r="3" fill="white"/>
    </g>
  </g>
  
  <!-- 나이 숫자들 (플로팅) -->
  <g opacity="0.6">
    <text x="350" y="200" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#iconGradient)">25</text>
    <text x="400" y="180" font-family="Arial, sans-serif" font-size="20" fill="url(#iconGradient)">32</text>
    <text x="320" y="240" font-family="Arial, sans-serif" font-size="18" fill="url(#iconGradient)">28</text>
    <text x="380" y="260" font-family="Arial, sans-serif" font-size="22" fill="url(#iconGradient)">19</text>
  </g>
  
  <!-- 메인 텍스트 -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#2d3748" text-anchor="middle">
    AI Face Age Test
  </text>
  
  <!-- 서브 텍스트 -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="24" fill="#4a5568" text-anchor="middle">
    What is your age in AI's eyes?
  </text>
  
  <!-- 특징 아이콘들 -->
  <g transform="translate(450,350)">
    <!-- 빠른 분석 -->
    <g>
      <circle cx="0" cy="0" r="25" fill="url(#iconGradient)" opacity="0.8"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">⚡</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">Fast Analysis</text>
    </g>
    
    <!-- 개인정보 보호 -->
    <g transform="translate(100,0)">
      <circle cx="0" cy="0" r="25" fill="url(#iconGradient)" opacity="0.8"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">🔒</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">Secure</text>
    </g>
    
    <!-- 모든 기기 지원 -->
    <g transform="translate(200,0)">
      <circle cx="0" cy="0" r="25" fill="url(#iconGradient)" opacity="0.8"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">📱</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">All Devices</text>
    </g>
    
    <!-- AI 기술 -->
    <g transform="translate(300,0)">
      <circle cx="0" cy="0" r="25" fill="url(#iconGradient)" opacity="0.8"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">🤖</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle">AI Technology</text>
    </g>
  </g>
  
  <!-- 하단 브랜드 -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    aige.netlify.app
  </text>
</svg> 